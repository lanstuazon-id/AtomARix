<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Nucleus -->
  <circle cx="32" cy="32" r="7" fill="#6e45e2"/>

  <!-- Orbit 1 — purple electron -->
  <ellipse cx="32" cy="32" rx="24" ry="10"
    fill="none" stroke="#6e45e2" stroke-width="2.2"
    transform="rotate(-30 32 32)"/>
  <circle cx="32" cy="22" r="4"
    fill="#4facfe"
    transform="rotate(-30 32 32)"/>

  <!-- Orbit 2 — pink electron -->
  <ellipse cx="32" cy="32" rx="24" ry="10"
    fill="none" stroke="#ee0979" stroke-width="2.2"
    transform="rotate(30 32 32)"/>
  <circle cx="32" cy="42" r="4"
    fill="#ee0979"
    transform="rotate(30 32 32)"/>

  <!-- Orbit 3 — blue electron -->
  <ellipse cx="32" cy="32" rx="24" ry="10"
    fill="none" stroke="#4facfe" stroke-width="2.2"
    transform="rotate(90 32 32)"/>
  <circle cx="56" cy="32" r="4"
    fill="#6e45e2"
    transform="rotate(90 32 32)"/>
</svg>
